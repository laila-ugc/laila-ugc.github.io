<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F7F5FB">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laila — Videos UGC para marcas</title>
<meta name="description" content="Portfolio de videos UGC para marcas.">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600,100,0&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5FB; --surface:#FFFFFF; --ink:#2B2533; --soft:#6B6375; --line:#E7E2EF; --accent:#4D3DF5; --onaccent:#FFFFFF;
  --butter:#FFEDB3; --mint:#D3F1DE; --blush:#FBDCE3; --lilac:#E6DCF8; --sky:#D6E8FB;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.disp{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:600;font-variation-settings:"SOFT" 100,"WONK" 0;letter-spacing:-.02em}
.wrap{max-width:76rem;margin:0 auto;padding:0 clamp(1.25rem,4vw,3rem)}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-top:1.2rem;padding-bottom:1.2rem}
.me{display:flex;align-items:center;gap:.75rem}
.me img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--surface);box-shadow:0 0 0 2px var(--lilac)}
.me b{font-weight:700;font-size:1.05rem;display:block;line-height:1.1}
.me span{font-size:.85rem;color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 1.4rem;border-radius:999px;background:var(--accent);color:var(--onaccent);font-weight:700;text-decoration:none;border:0;font-size:1rem;cursor:pointer;font-family:inherit}
.btn.soft{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.hero{padding:clamp(1rem,4vw,3rem) 0 clamp(1.5rem,4vw,3rem)}
.hero .in{display:flex;flex-wrap:wrap;align-items:center;gap:1.75rem 3rem}
.hero .txt{flex:1 1 100%;min-width:0;max-width:44rem}
.hero h1{margin:0;font-size:clamp(2.2rem,8.5vw,4.8rem);line-height:1.02;max-width:13ch}
.hero p{margin:1.1rem 0 1.6rem;font-size:clamp(1.05rem,2vw,1.2rem);max-width:30rem;color:var(--soft)}
.car{position:relative;margin-top:clamp(1.5rem,4vw,2.5rem)}
.car .track{display:flex;gap:clamp(.6rem,1.5vw,1rem);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:.25rem max(clamp(1.25rem,4vw,3rem),calc((100vw - 76rem) / 2 + 3rem)) .75rem;scroll-padding-inline:max(clamp(1.25rem,4vw,3rem),calc((100vw - 76rem) / 2 + 3rem))}
.car .track::-webkit-scrollbar{display:none}
.car .ph{position:relative;flex:0 0 clamp(8.5rem,36vw,10.5rem);aspect-ratio:9/16;border-radius:24px;padding:6px;border:0;cursor:pointer;scroll-snap-align:start;background:var(--butter)}
.car .ph:nth-child(5n+2){background:var(--lilac)}.car .ph:nth-child(5n+3){background:var(--mint)}.car .ph:nth-child(5n+4){background:var(--blush)}.car .ph:nth-child(5n+5){background:var(--sky)}
.car .ph.h{flex-basis:clamp(16rem,64vw,19rem);aspect-ratio:16/9;align-self:center}
.car .clip{position:absolute;inset:6px;border-radius:18px;overflow:hidden;background:#000}
.car video,.car img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.car video{opacity:0;transition:opacity .4s}.car .ph.live video{opacity:1}
.car .ph .t{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;color:#fff;font-size:.8rem;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6);text-align:left;line-height:1.2}
.car .ph:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.flecha{position:absolute;top:50%;z-index:3;width:48px;height:48px;margin-top:-30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.flecha svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.flecha.izq{left:max(.5rem,calc((100vw - 76rem) / 2 + .5rem))}.flecha.der{right:max(.5rem,calc((100vw - 76rem) / 2 + .5rem))}
@media (hover:hover) and (min-width:700px){.flecha{display:flex}}
@media (prefers-reduced-motion:reduce){.car video{transition:none}}
.cats{display:flex;flex-direction:column;gap:.75rem;padding:.5rem 0 1rem}
details.cat{scroll-margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
details.cat>summary{list-style:none;display:flex;align-items:center;gap:.8rem;min-height:64px;padding:.75rem 1.25rem;cursor:pointer}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary .dot{width:2.2rem;height:2.2rem;border-radius:50%;flex:0 0 auto}
details.cat>summary h2{margin:0;font-size:clamp(1.25rem,4.5vw,1.7rem);line-height:1.1;flex:1 1 auto;min-width:0}
details.cat>summary .n{font-size:.9rem;color:var(--soft);font-weight:600;flex:0 0 auto}
details.cat>summary .chev{width:1.1rem;height:1.1rem;flex:0 0 auto;transition:transform .2s;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
details.cat[open]>summary .chev{transform:rotate(180deg)}
details.cat .body{padding:.25rem 1.25rem 1.25rem}
@media (prefers-reduced-motion:reduce){details.cat>summary .chev{transition:none}}
.brandrow{margin-bottom:1.5rem}.brandrow:last-child{margin-bottom:0}
.brandrow h3{margin:0 0 .9rem;font-size:.9rem;font-weight:700;color:var(--soft)}
.row{display:flex;align-items:flex-start;gap:1rem;overflow-x:auto;padding-bottom:.6rem;scroll-snap-type:x proximity;scrollbar-width:thin}
.tile{flex:0 0 auto;width:min(46vw,14.5rem);scroll-snap-align:start;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.tile.h{width:min(84vw,26rem)}
.thumb{position:relative;aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:var(--line)}
.tile.h .thumb{aspect-ratio:16/9}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb video{opacity:0;transition:opacity .25s}
.tile.live .thumb video{opacity:1}
.play{position:absolute;z-index:2;left:.7rem;bottom:.7rem;width:2.75rem;height:2.75rem;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.play svg{width:.9rem;height:.9rem;fill:var(--accent);margin-left:2px}
.tile p{margin:.6rem 0 0;font-size:.95rem;line-height:1.35;font-weight:500}
.tile:focus-visible .thumb{outline:3px solid var(--accent);outline-offset:3px}
footer{margin:3rem auto 2.5rem;max-width:76rem;padding:0 clamp(1.25rem,4vw,3rem)}
footer .box{background:var(--lilac);border-radius:32px;padding:clamp(2rem,5vw,3.5rem)}
footer h2{margin:0 0 .5rem;font-size:clamp(2rem,5.5vw,3.4rem);line-height:1.02;max-width:16ch}
footer p{margin:0 0 1.5rem;font-size:1.05rem;color:var(--ink)}
footer .links{display:flex;flex-wrap:wrap;gap:.6rem}
footer .links a{display:inline-flex;align-items:center;min-height:48px;padding:0 1.3rem;border-radius:999px;background:var(--accent);color:var(--onaccent);text-decoration:none;font-weight:700}
footer .links a.sec{background:var(--surface);color:var(--ink)}
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%}
dialog::backdrop{background:rgba(30,24,40,.88)}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 4rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1.5rem)}
.stage video{max-width:100%;max-height:100%;border-radius:18px;background:#000}
.close{position:fixed;top:calc(env(safe-area-inset-top,0px) + .9rem);right:1rem;font:700 1rem "Manrope",sans-serif;background:#fff;color:#2B2533;border:0;border-radius:999px;min-height:44px;padding:0 1.1rem;cursor:pointer}
.cap{position:fixed;top:calc(env(safe-area-inset-top,0px) + 1.4rem);left:1rem;right:8rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.thumb video{transition:none}}

.redes{display:flex;flex-wrap:wrap;gap:.5rem;margin:-.4rem 0 1.5rem}
.redes a{display:inline-flex;align-items:center;min-height:40px;padding:0 1rem;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:.92rem}
.redes a:hover{border-color:var(--ink)}
.filtros{display:flex;flex-direction:column;gap:.5rem;margin:.25rem 0 1.25rem}
.chips{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips button{flex:0 0 auto;min-height:40px;padding:0 1rem;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 .9rem "Manrope",sans-serif;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge{position:absolute;z-index:2;left:.6rem;top:.6rem;font-size:.72rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;background:#E6DCF8;color:#2B2533}
.badge.produccion{background:#D3F1DE}
.vacio{color:var(--soft);margin:.5rem 0}
.loading{padding:30vh 0;text-align:center;color:var(--soft)}
</style>
</head>
<body>
<div class="wrap top">
  <div class="me"><img id="foto" alt="" hidden><div><b id="nombre"></b><span id="rol"></span></div></div>
  <a class="btn soft" id="topcta" hidden>Escribime</a>
</div>
<div class="loading" id="loading">Cargando…</div>
<header class="hero" id="hero" hidden>
  <div class="wrap in">
    <div class="txt">
      <h1 class="disp" id="frase"></h1>
      <p id="intro"></p>
      <div class="redes" id="redes" hidden></div>
      <button class="btn" id="herobtn">Ver videos</button>
    </div>
  </div>
  <div class="car" id="car">
    <button class="flecha izq" id="carIzq" aria-label="Anteriores"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg></button>
    <div class="track" id="reel" aria-label="Videos destacados"></div>
    <button class="flecha der" id="carDer" aria-label="Siguientes"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg></button>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer id="foot" hidden>
  <div class="box">
    <h2 class="disp" id="cierreTitulo"></h2>
    <p id="cierreTexto"></p>
    <div class="links" id="links"></div>
  </div>
</footer>
<dialog id="dlg" aria-label="Video">
  <div class="cap" id="cap"></div>
  <button class="close" id="close">Cerrar</button>
  <div class="stage" id="stage"></div>
</dialog>
<script type="module">
import { FIREBASE, SDK, ACENTOS, TONOS, TONOS_OSC, videoSrc, posterSrc, imgSrc, linksContacto, cl } from "./config.js";
const { initializeApp } = await import(SDK + "firebase-app.js");
const { getFirestore, doc, getDoc } = await import(SDK + "firebase-firestore.js");

const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const playIcon = '<svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0l10 6-10 6z"/></svg>';
const canHover = matchMedia("(hover: hover)").matches;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const dark = false; // la página es siempre clara
let S = null, CATS = [];

function armar(data) {
  return (data.categorias || []).map(c => {
    const vids = (data.videos || []).filter(v => v.cat === c.id && v.url);
    const marcas = [];
    vids.forEach(v => { const n = (v.marca || "").trim() || "Otros"; let m = marcas.find(x => x.n === n); if (!m) marcas.push(m = { n, v: [] }); m.v.push(v); });
    return { ...c, marcas, total: vids.length };
  }).filter(c => c.total);
}

function tile(v) {
  const b = el("button", "tile" + (v.h ? " h" : ""));
  b.setAttribute("aria-label", "Ver video: " + (v.titulo || ""));
  const th = el("div", "thumb");
  const img = el("img"); img.src = posterSrc(v); img.alt = ""; img.loading = "lazy";
  const p = el("span", "play"); p.innerHTML = playIcon;
  th.append(img, p);
  if (v.tipo === "ugc" || v.tipo === "produccion") th.append(el("span", "badge " + v.tipo, v.tipo === "ugc" ? "UGC" : "Producción"));
  if (canHover && !reduce) {
    let pv = null;
    b.addEventListener("mouseenter", () => {
      if (!pv) { pv = el("video"); pv.muted = true; pv.loop = true; pv.playsInline = true; pv.preload = "auto"; pv.src = videoSrc(v); th.insertBefore(pv, p); }
      pv.play().then(() => b.classList.add("live")).catch(() => {});
    });
    b.addEventListener("mouseleave", () => { if (pv) { pv.pause(); b.classList.remove("live"); } });
  }
  b.append(th, el("p", null, v.titulo || ""));
  b.onclick = () => abrir(v);
  return b;
}

function seccion(c, abierto) {
  const d = el("details", "cat"); d.id = "sec-" + c.id; d.open = !!abierto;
  const sm = el("summary");
  const dot = el("span", "dot"); dot.style.background = (dark ? TONOS_OSC : TONOS)[c.tono] || "var(--line)";
  sm.append(dot, el("h2", "disp", c.nombre), el("span", "n", c.total + (c.total === 1 ? " video" : " videos")));
  sm.insertAdjacentHTML("beforeend", '<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg>');
  d.append(sm);
  const body = el("div", "body"); let lleno = false;
  const todos = c.marcas.flatMap(m => m.v);
  const hayTipos = todos.some(v => v.tipo === "ugc") && todos.some(v => v.tipo === "produccion");
  const conMarcas = c.marcas.length >= 4;
  let fT = "", fM = "";
  const filtros = el("div", "filtros"), lista = el("div");
  const chipsDe = (opts, actual, fn) => { const w = el("div", "chips"); opts.forEach(([v, t]) => { const b = el("button", null, t); b.setAttribute("aria-pressed", String(v === actual)); b.onclick = () => fn(v); w.append(b); }); return w; };
  const pintar = () => {
    filtros.replaceChildren();
    if (hayTipos) filtros.append(chipsDe([["", "Todo"], ["ugc", "UGC"], ["produccion", "Producción"]], fT, v => { fT = v; pintar(); }));
    if (conMarcas) filtros.append(chipsDe([["", "Todas las marcas"], ...c.marcas.map(m => [m.n, m.n])], fM, v => { fM = v; pintar(); }));
    lista.replaceChildren();
    c.marcas.filter(m => !fM || m.n === fM).forEach(m => {
      const vs = m.v.filter(v => !fT || v.tipo === fT); if (!vs.length) return;
      const r0 = el("div", "brandrow"); r0.append(el("h3", null, m.n)); const r = el("div", "row"); vs.forEach(v => r.append(tile(v))); r0.append(r); lista.append(r0);
    });
    if (!lista.children.length) lista.append(el("p", "vacio", "No hay videos con ese filtro."));
  };
  const llenar = () => { if (lleno) return; lleno = true; if (hayTipos || conMarcas) body.append(filtros); body.append(lista); pintar(); };
  d.append(body);
  if (abierto) llenar();
  d.addEventListener("toggle", () => {
    if (!d.open) return; llenar();
    document.querySelectorAll("details.cat[open]").forEach(o => { if (o !== d) o.open = false; });
    requestAnimationFrame(() => d.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }));
  });
  return d;
}

// Vista previa liviana para el carrusel: 360 px, sin audio, primeros 8 segundos
const previa = v => cl(v.url, "c_limit,w_360,q_auto:low,ac_none,eo_8", "mp4");
let carTimer = null, carPausa = 0, carObs = null;
function reel(list) {
  const r = $("#reel"); r.replaceChildren();
  if (carObs) carObs.disconnect();
  carObs = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
    const ph = e.target, vid = ph.querySelector("video");
    if (e.isIntersecting && e.intersectionRatio > 0.6) {
      if (!vid && !reduce) { const v = el("video"); v.muted = true; v.loop = true; v.playsInline = true; v.setAttribute("muted", ""); v.setAttribute("playsinline", ""); v.preload = "auto"; v.src = ph.dataset.src; v.addEventListener("playing", () => ph.classList.add("live")); ph.querySelector(".clip").append(v); v.play().catch(() => {}); }
      else if (vid) vid.play().catch(() => {});
    } else if (vid) vid.pause();
  }), { threshold: [0, 0.6, 1] }) : null;
  list.forEach(v => {
    const ph = el("button", "ph" + (v.h ? " h" : "")); ph.dataset.src = previa(v);
    ph.setAttribute("aria-label", "Ver video: " + (v.titulo || v.marca || ""));
    const clip = el("div", "clip"); const img = el("img"); img.src = posterSrc(v); img.alt = ""; img.loading = "lazy"; clip.append(img); ph.append(clip);
    if (v.marca) ph.append(el("span", "t", v.marca));
    ph.onclick = () => abrir(v);
    r.append(ph); if (carObs) carObs.observe(ph);
  });
  const paso = dir => { const it = r.querySelector(".ph"); if (!it) return; const w = it.getBoundingClientRect().width + parseFloat(getComputedStyle(r).columnGap || 12);
    const fin = r.scrollLeft + r.clientWidth >= r.scrollWidth - 4;
    if (dir > 0 && fin) r.scrollTo({ left: 0, behavior: "smooth" }); else r.scrollBy({ left: dir * w, behavior: reduce ? "auto" : "smooth" }); };
  $("#carIzq").onclick = () => { carPausa = Date.now(); paso(-1); };
  $("#carDer").onclick = () => { carPausa = Date.now(); paso(1); };
  ["pointerdown", "wheel", "touchstart", "mouseenter"].forEach(ev => r.addEventListener(ev, () => carPausa = Date.now(), { passive: true }));
  clearInterval(carTimer);
  if (!reduce && list.length > 2) carTimer = setInterval(() => { if (document.hidden || Date.now() - carPausa < 6000 || dlg.open) return; paso(1); }, 3200);
}

function elegirReel(shown, filtrado) {
  const todos = shown.flatMap(c => c.marcas.flatMap(m => m.v));
  const out = filtrado ? [] : todos.filter(v => v.destacado);
  // uno por marca primero, después el resto
  shown.forEach(c => c.marcas.forEach(m => { const v = m.v.find(x => !out.includes(x)); if (v) out.push(v); }));
  todos.forEach(v => { if (!out.includes(v)) out.push(v); });
  return out.slice(0, 14);
}

function render() {
  const key = decodeURIComponent((location.hash || "").slice(1));
  const only = CATS.find(c => c.id === key);
  const shown = only ? [only] : CATS;
  const main = $("#main"); main.replaceChildren();
  if (!CATS.length) { main.append(el("p", "loading", "Portfolio en preparación.")); $("#hero").hidden = true; return; }
  $("#hero").hidden = false;
  reel(elegirReel(shown, !!only));
  $("#intro").textContent = S.intro || "";
  const box = el("div", "cats"); box.id = "cats";
  shown.forEach(c => box.append(seccion(c, !!only)));
  main.append(box);
  window.scrollTo(0, 0);
}

function contacto() {
  const L = $("#links"); L.replaceChildren();
  const lista = linksContacto(S.contacto || {});
  lista.forEach((c, i) => {
    const a = el("a", i ? "sec" : null, i === 0 && c.k === "whatsapp" ? "Escribir por WhatsApp" : c.t);
    a.href = c.href; if (!/^(tel|mailto):/.test(c.href)) { a.target = "_blank"; a.rel = "noopener"; }
    L.append(a);
  });
  $("#foot").hidden = !lista.length;
  const R = $("#redes"); R.replaceChildren();
  lista.filter(c => ["instagram", "tiktok", "facebook", "linkedin", "youtube", "web"].includes(c.k)).forEach(c => {
    const a = el("a", null, c.k === "web" ? "Web" : c.t); a.href = c.href; a.target = "_blank"; a.rel = "noopener"; R.append(a);
  });
  R.hidden = !R.children.length;
  const t = $("#topcta");
  if (lista.length) { t.href = lista[0].href; if (!/^(tel|mailto):/.test(lista[0].href)) { t.target = "_blank"; t.rel = "noopener"; } t.hidden = false; }
}

const dlg = $("#dlg");
function abrir(v) {
  const vid = el("video"); vid.src = videoSrc(v); vid.controls = true; vid.autoplay = true; vid.playsInline = true; vid.preload = "auto";
  $("#stage").replaceChildren(vid); $("#cap").textContent = v.titulo || "";
  dlg.showModal(); vid.play().catch(() => {});
}
function cerrar() { const v = $("#stage video"); if (v) { v.pause(); v.removeAttribute("src"); v.load(); } $("#stage").replaceChildren(); dlg.close(); }
$("#close").onclick = cerrar;
dlg.addEventListener("cancel", e => { e.preventDefault(); cerrar(); });
$("#stage").addEventListener("click", e => { if (e.target.id === "stage") cerrar(); });
$("#herobtn").onclick = () => $("#main").scrollIntoView({ behavior: reduce ? "auto" : "smooth" });

try {
  const db = getFirestore(initializeApp(FIREBASE));
  const snap = await getDoc(doc(db, "publico", "sitio"));
  S = snap.exists() ? snap.data() : null;
} catch (e) { console.error(e); }
$("#loading").hidden = true;
if (!S) { $("#main").append(el("p", "loading", "Portfolio en preparación.")); }
else {
  document.documentElement.style.setProperty("--accent", ACENTOS[S.acento] || ACENTOS.violeta);
  $("#nombre").textContent = S.nombre || ""; $("#rol").textContent = S.rol || "";
  document.title = (S.nombre || "Portfolio") + " — Videos UGC para marcas";
  if (S.foto) { const f = $("#foto"); f.src = imgSrc(S.foto, 160); f.alt = S.nombre || ""; f.hidden = false; }
  $("#frase").textContent = S.frase || "";
  $("#cierreTitulo").textContent = S.cierreTitulo || ""; $("#cierreTexto").textContent = S.cierreTexto || "";
  CATS = armar(S);
  render(); contacto();
  window.addEventListener("hashchange", render);
}
</script>
</body>
</html>
